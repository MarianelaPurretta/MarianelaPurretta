      - name: Generate last 12 months card
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          FROM_DATE=$(date -u -d "365 days ago" +"%Y-%m-%dT00:00:00Z")
          TO_DATE=$(date -u +"%Y-%m-%dT23:59:59Z")

          # Limpiar posibles saltos de línea/caracteres CR del secret
          CLEAN_TOKEN=$(printf '%s' "$STATS_PAT" | tr -d '\r\n')

          echo "From: $FROM_DATE"
          echo "To:   $TO_DATE"

          GH_TOKEN="$CLEAN_TOKEN" gh api graphql \
            -f query='
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    totalCommitContributions
                    totalPullRequestContributions
                  }
                }
              }
            ' \
            -F login="$USERNAME" \
            -F from="$FROM_DATE" \
            -F to="$TO_DATE" \
            > contribution-data.json

          echo "GitHub response:"
          jq . contribution-data.json

          COMMITS=$(jq -r \
            '.data.user.contributionsCollection.totalCommitContributions' \
            contribution-data.json)

          PRS=$(jq -r \
            '.data.user.contributionsCollection.totalPullRequestContributions' \
            contribution-data.json)

          if [ "$COMMITS" = "null" ] || [ -z "$COMMITS" ]; then
            echo "Could not obtain commit statistics."
            exit 1
          fi

          if [ "$PRS" = "null" ] || [ -z "$PRS" ]; then
            echo "Could not obtain Pull Request statistics."
            exit 1
          fi

          echo "Commits last 12 months: $COMMITS"
          echo "Pull Requests last 12 months: $PRS"

          mkdir -p profile

          export COMMITS
          export PRS

          python3 <<'PY'
          import os

          commits = os.environ["COMMITS"]
          prs = os.environ["PRS"]

          svg = f'''<svg width="495" height="195"
            viewBox="0 0 495 195"
            xmlns="http://www.w3.org/2000/svg">

            <rect
              x="0.5"
              y="0.5"
              width="494"
              height="194"
              rx="4.5"
              fill="#000000"
              stroke="#FFFFFF"
            />

            <text
              x="247.5"
              y="38"
              text-anchor="middle"
              fill="#FFA500"
              font-family="Arial, sans-serif"
              font-size="19"
              font-weight="700">
              Actividad de los últimos 12 meses
            </text>

            <line
              x1="247.5"
              y1="62"
              x2="247.5"
              y2="158"
              stroke="#FFFFFF"
              opacity="0.55"
            />

            <text
              x="125"
              y="105"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="34"
              font-weight="700">
              {commits}
            </text>

            <text
              x="125"
              y="135"
              text-anchor="middle"
              fill="#FFA500"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="700">
              Commits
            </text>

            <text
              x="370"
              y="105"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="34"
              font-weight="700">
              {prs}
            </text>

            <text
              x="370"
              y="135"
              text-anchor="middle"
              fill="#FFA500"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="700">
              Pull Requests
            </text>

            <text
              x="247.5"
              y="174"
              text-anchor="middle"
              fill="#AAAAAA"
              font-family="Arial, sans-serif"
              font-size="11">
              Actividad registrada durante los últimos 12 meses
            </text>

          </svg>'''

          output = "profile/last-12-months.svg"

          with open(output, "w", encoding="utf-8") as file:
              file.write(svg)

          print(f"Generated: {output}")
          print(f"Commits: {commits}")
          print(f"Pull Requests: {prs}")
          PY
