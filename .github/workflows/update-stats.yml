name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =======================================================
      # CHECKOUT
      # =======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =======================================================
      # VALIDAR TOKEN
      # =======================================================

      - name: Check PAT rate limit
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
        run: |
          echo "GitHub API rate limit:"

          curl -s \
            -H "Authorization: Bearer $STATS_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/rate_limit \
            | jq '.rate | {limit, remaining, reset}'


      # =======================================================
      # VALIDAR ACCESO A BITACORA
      # =======================================================

      - name: Check Bitacora access
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $STATS_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MarianelaPurretta/Bitacora)

          echo "Bitacora API status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "PAT cannot access Bitacora"
            exit 1
          fi


      # =======================================================
      # CARD 1
      # ACTIVIDAD ÚLTIMOS 12 MESES
      # COMMITS + CONTRIBUCIONES
      # =======================================================

      - name: Generate last 12 months card
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          FROM_DATE=$(date -u -d "365 days ago" +"%Y-%m-%dT00:00:00Z")
          TO_DATE=$(date -u +"%Y-%m-%dT23:59:59Z")

          CLEAN_TOKEN=$(printf '%s' "$STATS_PAT" | tr -d '\r\n')

          echo "From: $FROM_DATE"
          echo "To:   $TO_DATE"

          GH_TOKEN="$CLEAN_TOKEN" gh api graphql \
            -f query='
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    totalCommitContributions
                    contributionCalendar {
                      totalContributions
                    }
                  }
                }
              }
            ' \
            -F login="$USERNAME" \
            -F from="$FROM_DATE" \
            -F to="$TO_DATE" \
            > contribution-data.json

          COMMITS=$(jq -r \
            '.data.user.contributionsCollection.totalCommitContributions' \
            contribution-data.json)

          CONTRIBUTIONS=$(jq -r \
            '.data.user.contributionsCollection.contributionCalendar.totalContributions' \
            contribution-data.json)

          if [ "$COMMITS" = "null" ] || [ -z "$COMMITS" ]; then
            echo "Could not obtain commit statistics."
            exit 1
          fi

          if [ "$CONTRIBUTIONS" = "null" ] || [ -z "$CONTRIBUTIONS" ]; then
            echo "Could not obtain contribution statistics."
            exit 1
          fi

          echo "Commits last 12 months: $COMMITS"
          echo "Contributions last 12 months: $CONTRIBUTIONS"

          mkdir -p profile

          export COMMITS
          export CONTRIBUTIONS

          python3 <<'PY'
          import os

          commits = os.environ["COMMITS"]
          contributions = os.environ["CONTRIBUTIONS"]

          svg = f'''<svg width="495" height="195"
            viewBox="0 0 495 195"
            xmlns="http://www.w3.org/2000/svg">

            <rect
              x="0.5"
              y="0.5"
              width="494"
              height="194"
              rx="0"
              fill="#000000"
              stroke="#808080"
            />

            <text
              x="247.5"
              y="38"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="19"
              font-weight="700">
              Actividad de los últimos 12 meses
            </text>

            <line
              x1="247.5"
              y1="62"
              x2="247.5"
              y2="158"
              stroke="#808080"
            />

            <text
              x="125"
              y="105"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="34"
              font-weight="700">
              {commits}
            </text>

            <text
              x="125"
              y="135"
              text-anchor="middle"
              fill="#BFBFBF"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="700">
              Commits
            </text>

            <text
              x="370"
              y="105"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="34"
              font-weight="700">
              {contributions}
            </text>

            <text
              x="370"
              y="135"
              text-anchor="middle"
              fill="#BFBFBF"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="700">
              Contribuciones
            </text>

            <text
              x="247.5"
              y="174"
              text-anchor="middle"
              fill="#8F8F8F"
              font-family="Arial, sans-serif"
              font-size="11">
              Actividad registrada durante los últimos 12 meses
            </text>

          </svg>'''

          with open(
              "profile/last-12-months.svg",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(svg)

          print("Generated: profile/last-12-months.svg")
          PY


      # =======================================================
      # CARD 2
      # ESTADÍSTICAS GENERALES
      # =======================================================

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&number_format=long&card_width=495&bg_color=000000&title_color=FFFFFF&text_color=E5E5E5&icon_color=BFBFBF&border_color=808080&border_radius=0&locale=es
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: true


      # =======================================================
      # CARD 3
      # STACK PRINCIPAL
      # =======================================================

      - name: Generate stack card
        run: |
          mkdir -p profile

          python3 <<'PY'
          svg = '''<svg width="495" height="195"
            viewBox="0 0 495 195"
            xmlns="http://www.w3.org/2000/svg">

            <rect
              x="0.5"
              y="0.5"
              width="494"
              height="194"
              rx="0"
              fill="#000000"
              stroke="#808080"
            />

            <text
              x="247.5"
              y="36"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="20"
              font-weight="700">
              Stack principal
            </text>

            <text
              x="247.5"
              y="62"
              text-anchor="middle"
              fill="#8F8F8F"
              font-family="Arial, sans-serif"
              font-size="11">
              Tecnologías con las que trabajo actualmente
            </text>

            <text
              x="247.5"
              y="96"
              text-anchor="middle"
              fill="#E5E5E5"
              font-family="Arial, sans-serif"
              font-size="15">
              Java · Spring Boot · TypeScript · React · Angular
            </text>

            <text
              x="247.5"
              y="126"
              text-anchor="middle"
              fill="#E5E5E5"
              font-family="Arial, sans-serif"
              font-size="15">
              Vue · Python · MySQL · Redis · RabbitMQ
            </text>

            <text
              x="247.5"
              y="156"
              text-anchor="middle"
              fill="#BFBFBF"
              font-family="Arial, sans-serif"
              font-size="15">
              AWS · Docker · Git · Postman
            </text>

          </svg>'''

          with open(
              "profile/stack.svg",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(svg)

          print("Generated: profile/stack.svg")
          PY


      # =======================================================
      # CARD 4
      # REPOSITORIO DESTACADO - BITACORA
      # =======================================================

      - name: Generate Bitacora featured card
        run: |
          mkdir -p profile

          python3 <<'PY'
          svg = '''<svg width="495" height="195"
            viewBox="0 0 495 195"
            xmlns="http://www.w3.org/2000/svg">

            <rect
              x="0.5"
              y="0.5"
              width="494"
              height="194"
              rx="0"
              fill="#000000"
              stroke="#808080"
            />

            <text
              x="32"
              y="42"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="22"
              font-weight="700">
              Bitácora
            </text>

            <text
              x="32"
              y="70"
              fill="#BFBFBF"
              font-family="Arial, sans-serif"
              font-size="13">
              Repositorio privado de seguimiento técnico
            </text>

            <line
              x1="32"
              y1="88"
              x2="463"
              y2="88"
              stroke="#505050"
            />

            <text
              x="32"
              y="118"
              fill="#E5E5E5"
              font-family="Arial, sans-serif"
              font-size="14">
              Desarrollo · análisis · implementación · testing
            </text>

            <text
              x="32"
              y="145"
              fill="#E5E5E5"
              font-family="Arial, sans-serif"
              font-size="14">
              documentación · seguimiento de cambios
            </text>

            <text
              x="32"
              y="174"
              fill="#8F8F8F"
              font-family="Arial, sans-serif"
              font-size="11">
              Actividad incluida en las estadísticas privadas del perfil
            </text>

          </svg>'''

          with open(
              "profile/bitacora.svg",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(svg)

          print("Generated: profile/bitacora.svg")
          PY


      # =======================================================
      # CARD 5
      # LOGROS DE GITHUB
      # =======================================================

      - name: Generate GitHub trophies card
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$STATS_PAT" | tr -d '\r\n')

          GH_TOKEN="$CLEAN_TOKEN" gh api graphql \
            -f query='
              query($login: String!) {
                user(login: $login) {
                  repositories(
                    first: 100,
                    ownerAffiliations: OWNER,
                    privacy: PUBLIC
                  ) {
                    totalCount
                    nodes {
                      stargazerCount
                    }
                  }
                }
              }
            ' \
            -F login="$USERNAME" \
            > trophies-data.json

          PUBLIC_REPOS=$(jq -r \
            '.data.user.repositories.totalCount' \
            trophies-data.json)

          TOTAL_STARS=$(jq \
            '[.data.user.repositories.nodes[].stargazerCount] | add // 0' \
            trophies-data.json)

          COMMITS=$(jq -r \
            '.data.user.contributionsCollection.totalCommitContributions' \
            contribution-data.json)

          CONTRIBUTIONS=$(jq -r \
            '.data.user.contributionsCollection.contributionCalendar.totalContributions' \
            contribution-data.json)

          echo "Public repositories: $PUBLIC_REPOS"
          echo "Stars: $TOTAL_STARS"
          echo "Commits last 12 months: $COMMITS"
          echo "Contributions last 12 months: $CONTRIBUTIONS"

          export PUBLIC_REPOS
          export TOTAL_STARS
          export COMMITS
          export CONTRIBUTIONS

          mkdir -p profile

          python3 <<'PY'
          import os

          repos = os.environ["PUBLIC_REPOS"]
          stars = os.environ["TOTAL_STARS"]
          commits = os.environ["COMMITS"]
          contributions = os.environ["CONTRIBUTIONS"]

          svg = f'''<svg width="495" height="195"
            viewBox="0 0 495 195"
            xmlns="http://www.w3.org/2000/svg">

            <rect
              x="0.5"
              y="0.5"
              width="494"
              height="194"
              rx="0"
              fill="#000000"
              stroke="#808080"
            />

            <text
              x="247.5"
              y="34"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="20"
              font-weight="700">
              Logros de GitHub
            </text>

            <line
              x1="247.5"
              y1="53"
              x2="247.5"
              y2="169"
              stroke="#505050"
            />

            <text
              x="124"
              y="91"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="29"
              font-weight="700">
              {commits}
            </text>

            <text
              x="124"
              y="113"
              text-anchor="middle"
              fill="#BFBFBF"
              font-family="Arial, sans-serif"
              font-size="12">
              Commits · 12 meses
            </text>

            <text
              x="371"
              y="91"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="29"
              font-weight="700">
              {contributions}
            </text>

            <text
              x="371"
              y="113"
              text-anchor="middle"
              fill="#BFBFBF"
              font-family="Arial, sans-serif"
              font-size="12">
              Contribuciones · 12 meses
            </text>

            <text
              x="124"
              y="151"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="22"
              font-weight="700">
              {stars}
            </text>

            <text
              x="124"
              y="172"
              text-anchor="middle"
              fill="#8F8F8F"
              font-family="Arial, sans-serif"
              font-size="11">
              Estrellas
            </text>

            <text
              x="371"
              y="151"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="22"
              font-weight="700">
              {repos}
            </text>

            <text
              x="371"
              y="172"
              text-anchor="middle"
              fill="#8F8F8F"
              font-family="Arial, sans-serif"
              font-size="11">
              Repositorios públicos
            </text>

          </svg>'''

          with open(
              "profile/trophies.svg",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(svg)

          print("Generated: profile/trophies.svg")
          PY


      # =======================================================
      # CARD 6
      # HEATMAP DE CONTRIBUCIONES - ÚLTIMOS 18 MESES
      # =======================================================

      - name: Generate 18 months contribution graph
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          export USERNAME
          export STATS_PAT

          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta

          username = os.environ["USERNAME"]
          token = os.environ["STATS_PAT"].strip()

          now = datetime.now(timezone.utc)

          # ===================================================
          # CALCULAR 18 MESES SIN DEPENDENCIAS EXTERNAS
          # ===================================================

          def subtract_months(dt, months):
              year = dt.year
              month = dt.month - months

              while month <= 0:
                  month += 12
                  year -= 1

              return dt.replace(
                  year=year,
                  month=month,
                  day=1
              )

          period_start = subtract_months(now, 18)

          # Dividir en dos consultas:
          # primeros 12 meses + últimos 6 meses
          period_split = subtract_months(now, 6)

          def iso_start(dt):
              return dt.strftime("%Y-%m-%dT00:00:00Z")

          def iso_end(dt):
              return dt.strftime("%Y-%m-%dT23:59:59Z")

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                      weekday
                    }
                    firstDay
                  }
                }
              }
            }
          }
          """

          def get_calendar(from_date, to_date):
              payload = json.dumps({
                  "query": query,
                  "variables": {
                      "login": username,
                      "from": from_date,
                      "to": to_date
                  }
              }).encode("utf-8")

              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "github-profile-stats"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  result = json.load(response)

              if "errors" in result:
                  raise RuntimeError(result["errors"])

              return result["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          calendar_1 = get_calendar(
              iso_start(period_start),
              iso_end(period_split - timedelta(seconds=1))
          )

          calendar_2 = get_calendar(
              iso_start(period_split),
              iso_end(now)
          )

          # ===================================================
          # UNIFICAR DÍAS
          # ===================================================

          days_by_date = {}

          for calendar in (calendar_1, calendar_2):
              for week in calendar["weeks"]:
                  for day in week["contributionDays"]:
                      days_by_date[day["date"]] = {
                          "date": day["date"],
                          "weekday": day["weekday"],
                          "count": day["contributionCount"]
                      }

          days = sorted(
              days_by_date.values(),
              key=lambda d: d["date"]
          )

          total = sum(day["count"] for day in days)

          print(f"Days obtained: {len(days)}")
          print(f"Total contributions: {total}")

          # ===================================================
          # AGRUPAR POR SEMANA
          # ===================================================

          weeks = []
          current_week = []

          for day in days:
              if day["weekday"] == 0 and current_week:
                  weeks.append(current_week)
                  current_week = []

              current_week.append(day)

          if current_week:
              weeks.append(current_week)

          max_count = max(
              (day["count"] for day in days),
              default=0
          )

          # ===================================================
          # ESCALA BLANCO / NEGRO / GRIS
          # ===================================================

          def level_color(count):
              if count == 0:
                  return "#111111"

              if max_count <= 1:
                  return "#FFFFFF"

              ratio = count / max_count

              if ratio <= 0.20:
                  return "#333333"

              if ratio <= 0.40:
                  return "#555555"

              if ratio <= 0.60:
                  return "#808080"

              if ratio <= 0.80:
                  return "#B5B5B5"

              return "#FFFFFF"

          # ===================================================
          # CONFIGURACIÓN
          # ===================================================

          card_width = 1180
          card_height = 260

          grid_x = 90
          grid_y = 95

          cell = 10
          gap = 3

          week_step = cell + gap
          row_step = cell + gap

          grid_height = 7 * cell + 6 * gap

          # ===================================================
          # MESES
          # ===================================================

          month_names = {
              1: "Ene",
              2: "Feb",
              3: "Mar",
              4: "Abr",
              5: "May",
              6: "Jun",
              7: "Jul",
              8: "Ago",
              9: "Sep",
              10: "Oct",
              11: "Nov",
              12: "Dic"
          }

          month_labels = []
          last_month = None

          for week_index, week in enumerate(weeks):
              if not week:
                  continue

              first_date = datetime.strptime(
                  week[0]["date"],
                  "%Y-%m-%d"
              )

              month_key = (
                  first_date.year,
                  first_date.month
              )

              if month_key != last_month:
                  month_labels.append({
                      "label": month_names[first_date.month],
                      "year": first_date.year,
                      "week": week_index
                  })

                  last_month = month_key

          # ===================================================
          # GENERAR SVG
          # ===================================================

          svg = []

          svg.append(
              f'<svg width="{card_width}" '
              f'height="{card_height}" '
              f'viewBox="0 0 {card_width} {card_height}" '
              f'xmlns="http://www.w3.org/2000/svg">'
          )

          svg.append(
              f'<rect x="0.5" y="0.5" '
              f'width="{card_width - 1}" '
              f'height="{card_height - 1}" '
              f'rx="0" '
              f'fill="#000000" '
              f'stroke="#808080"/>'
          )

          svg.append(
              '<text '
              'x="590" '
              'y="38" '
              'text-anchor="middle" '
              'fill="#FFFFFF" '
              'font-family="Arial, sans-serif" '
              'font-size="22" '
              'font-weight="700">'
              'Actividad en GitHub'
              '</text>'
          )

          svg.append(
              f'<text '
              f'x="590" '
              f'y="61" '
              f'text-anchor="middle" '
              f'fill="#AFAFAF" '
              f'font-family="Arial, sans-serif" '
              f'font-size="12">'
              f'Últimos 18 meses · {total} contribuciones'
              f'</text>'
          )

          # ===================================================
          # ETIQUETAS DE MESES
          # ===================================================

          previous_year = None

          for item in month_labels:
              x = grid_x + item["week"] * week_step

              label = item["label"]

              if previous_year != item["year"]:
                  label = f'{label} {item["year"]}'
                  previous_year = item["year"]

              svg.append(
                  f'<text '
                  f'x="{x}" '
                  f'y="{grid_y - 14}" '
                  f'fill="#BDBDBD" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="10">'
                  f'{label}'
                  f'</text>'
              )

          # ===================================================
          # ETIQUETAS DE DÍAS
          # ===================================================

          day_labels = [
              ("Lun", 1),
              ("Mié", 3),
              ("Vie", 5)
          ]

          for label, row in day_labels:
              y = grid_y + row * row_step + 9

              svg.append(
                  f'<text '
                  f'x="{grid_x - 18}" '
                  f'y="{y}" '
                  f'text-anchor="end" '
                  f'fill="#888888" '
                  f'font-family="Arial, sans-serif" '
                  f'font-size="10">'
                  f'{label}'
                  f'</text>'
              )

          # ===================================================
          # CELDAS
          # ===================================================

          for week_index, week in enumerate(weeks):
              for day in week:
                  x = grid_x + week_index * week_step
                  y = grid_y + day["weekday"] * row_step

                  color = level_color(day["count"])

                  date_text = day["date"]
                  count_text = day["count"]

                  svg.append(
                      f'<rect '
                      f'x="{x}" '
                      f'y="{y}" '
                      f'width="{cell}" '
                      f'height="{cell}" '
                      f'rx="0" '
                      f'fill="{color}" '
                      f'stroke="#1A1A1A">'
                      f'<title>{date_text}: '
                      f'{count_text} contribuciones</title>'
                      f'</rect>'
                  )

          # ===================================================
          # LEYENDA
          # ===================================================

          legend_y = grid_y + grid_height + 36
          legend_x = card_width - 245

          svg.append(
              f'<text '
              f'x="{legend_x}" '
              f'y="{legend_y + 9}" '
              f'fill="#888888" '
              f'font-family="Arial, sans-serif" '
              f'font-size="10">'
              f'Menos'
              f'</text>'
          )

          colors = [
              "#111111",
              "#333333",
              "#555555",
              "#808080",
              "#B5B5B5",
              "#FFFFFF"
          ]

          for index, color in enumerate(colors):
              x = legend_x + 42 + index * 16

              svg.append(
                  f'<rect '
                  f'x="{x}" '
                  f'y="{legend_y}" '
                  f'width="10" '
                  f'height="10" '
                  f'rx="0" '
                  f'fill="{color}" '
                  f'stroke="#222222"/>'
              )

          svg.append(
              f'<text '
              f'x="{legend_x + 150}" '
              f'y="{legend_y + 9}" '
              f'fill="#888888" '
              f'font-family="Arial, sans-serif" '
              f'font-size="10">'
              f'Más'
              f'</text>'
          )

          svg.append("</svg>")

          os.makedirs(
              "profile",
              exist_ok=True
          )

          output = "profile/contribution-18-months.svg"

          with open(
              output,
              "w",
              encoding="utf-8"
          ) as file:
              file.write("\n".join(svg))

          print(f"Generated: {output}")
          print(f"Total contributions: {total}")
          print(f"Weeks rendered: {len(weeks)}")
          PY


      # =======================================================
      # VERIFICAR CARDS
      # =======================================================

      - name: Verify generated cards
        run: |
          echo "Generated cards:"
          ls -lah profile/

          test -f profile/last-12-months.svg
          test -f profile/stats.svg
          test -f profile/stack.svg
          test -f profile/bitacora.svg
          test -f profile/trophies.svg
          test -f profile/contribution-18-months.svg

          echo "All cards generated successfully."


      # =======================================================
      # COMMIT AUTOMÁTICO
      # =======================================================

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/last-12-months.svg
          git add profile/stats.svg
          git add profile/stack.svg
          git add profile/bitacora.svg
          git add profile/trophies.svg
          git add profile/contribution-18-months.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub stats"
          git push
