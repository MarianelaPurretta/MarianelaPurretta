name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =======================================================
      # CHECKOUT
      # =======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =======================================================
      # VALIDAR TOKEN
      # =======================================================

      - name: Check PAT rate limit
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
        run: |
          echo "GitHub API rate limit:"

          curl -s \
            -H "Authorization: Bearer $STATS_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/rate_limit \
            | jq '.rate | {limit, remaining, reset}'


      # =======================================================
      # VALIDAR ACCESO A BITACORA
      # =======================================================

      - name: Check Bitacora access
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $STATS_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MarianelaPurretta/Bitacora)

          echo "Bitacora API status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "PAT cannot access Bitacora"
            exit 1
          fi


      # =======================================================
      # CARD 1
      # ACTIVIDAD ÚLTIMOS 12 MESES
      # COMMITS + CONTRIBUCIONES
      # =======================================================

      - name: Generate last 12 months card
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          FROM_DATE=$(date -u -d "365 days ago" +"%Y-%m-%dT00:00:00Z")
          TO_DATE=$(date -u +"%Y-%m-%dT23:59:59Z")

          CLEAN_TOKEN=$(printf '%s' "$STATS_PAT" | tr -d '\r\n')

          echo "From: $FROM_DATE"
          echo "To:   $TO_DATE"

          GH_TOKEN="$CLEAN_TOKEN" gh api graphql \
            -f query='
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    totalCommitContributions
                    contributionCalendar {
                      totalContributions
                    }
                  }
                }
              }
            ' \
            -F login="$USERNAME" \
            -F from="$FROM_DATE" \
            -F to="$TO_DATE" \
            > contribution-data.json

          COMMITS=$(jq -r \
            '.data.user.contributionsCollection.totalCommitContributions' \
            contribution-data.json)

          CONTRIBUTIONS=$(jq -r \
            '.data.user.contributionsCollection.contributionCalendar.totalContributions' \
            contribution-data.json)

          if [ "$COMMITS" = "null" ] || [ -z "$COMMITS" ]; then
            echo "Could not obtain commit statistics."
            exit 1
          fi

          if [ "$CONTRIBUTIONS" = "null" ] || [ -z "$CONTRIBUTIONS" ]; then
            echo "Could not obtain contribution statistics."
            exit 1
          fi

          echo "Commits last 12 months: $COMMITS"
          echo "Contributions last 12 months: $CONTRIBUTIONS"

          mkdir -p profile

          export COMMITS
          export CONTRIBUTIONS

          python3 <<'PY'
          import os

          commits = os.environ["COMMITS"]
          contributions = os.environ["CONTRIBUTIONS"]

          svg = f'''<svg width="495" height="195"
            viewBox="0 0 495 195"
            xmlns="http://www.w3.org/2000/svg">

            <rect
              x="0.5"
              y="0.5"
              width="494"
              height="194"
              rx="0"
              fill="#000000"
              stroke="#808080"
            />

            <text
              x="247.5"
              y="38"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="19"
              font-weight="700">
              Actividad de los últimos 12 meses
            </text>

            <line
              x1="247.5"
              y1="62"
              x2="247.5"
              y2="158"
              stroke="#808080"
            />

            <text
              x="125"
              y="105"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="34"
              font-weight="700">
              {commits}
            </text>

            <text
              x="125"
              y="135"
              text-anchor="middle"
              fill="#BFBFBF"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="700">
              Commits
            </text>

            <text
              x="370"
              y="105"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="34"
              font-weight="700">
              {contributions}
            </text>

            <text
              x="370"
              y="135"
              text-anchor="middle"
              fill="#BFBFBF"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="700">
              Contribuciones
            </text>

            <text
              x="247.5"
              y="174"
              text-anchor="middle"
              fill="#8F8F8F"
              font-family="Arial, sans-serif"
              font-size="11">
              Actividad registrada durante los últimos 12 meses
            </text>

          </svg>'''

          with open(
              "profile/last-12-months.svg",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(svg)

          print("Generated: profile/last-12-months.svg")
          PY


      # =======================================================
      # CARD 2
      # ESTADÍSTICAS GENERALES
      # =======================================================

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&number_format=long&card_width=495&bg_color=000000&title_color=FFFFFF&text_color=E5E5E5&icon_color=BFBFBF&border_color=808080&border_radius=0&locale=es
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: true


      # =======================================================
      # CARD 3
      # STACK PRINCIPAL
      # =======================================================

      - name: Generate stack card
        run: |
          mkdir -p profile

          python3 <<'PY'
          svg = '''<svg width="495" height="195"
