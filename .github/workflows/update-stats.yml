            xmlns="http://www.w3.org/2000/svg">

            <rect
              x="0.5"
              y="0.5"
              width="494"
              height="194"
              rx="0"
              fill="#000000"
              stroke="#808080"
            />

            <text
              x="247.5"
              y="36"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="20"
              font-weight="700">
              Stack principal
            </text>

            <text
              x="247.5"
              y="62"
              text-anchor="middle"
              fill="#8F8F8F"
              font-family="Arial, sans-serif"
              font-size="11">
              Tecnologías con las que trabajo actualmente
            </text>

            <text
              x="247.5"
              y="96"
              text-anchor="middle"
              fill="#E5E5E5"
              font-family="Arial, sans-serif"
              font-size="15">
              Java · Spring Boot · TypeScript · React · Angular
            </text>

            <text
              x="247.5"
              y="126"
              text-anchor="middle"
              fill="#E5E5E5"
              font-family="Arial, sans-serif"
              font-size="15">
              Vue · Python · MySQL · Redis · RabbitMQ
            </text>

            <text
              x="247.5"
              y="156"
              text-anchor="middle"
              fill="#BFBFBF"
              font-family="Arial, sans-serif"
              font-size="15">
              AWS · Docker · Git · Postman
            </text>

          </svg>'''

          with open(
              "profile/stack.svg",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(svg)

          print("Generated: profile/stack.svg")
          PY


      # =======================================================
      # CARD 4
      # REPOSITORIO DESTACADO - BITACORA
      # =======================================================

      - name: Generate Bitacora featured card
        run: |
          mkdir -p profile

          python3 <<'PY'
          svg = '''<svg width="495" height="195"
            viewBox="0 0 495 195"
            xmlns="http://www.w3.org/2000/svg">

            <rect
              x="0.5"
              y="0.5"
              width="494"
              height="194"
              rx="0"
              fill="#000000"
              stroke="#808080"
            />

            <text
              x="32"
              y="42"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="22"
              font-weight="700">
              Bitácora
            </text>

            <text
              x="32"
              y="70"
              fill="#BFBFBF"
              font-family="Arial, sans-serif"
              font-size="13">
              Repositorio privado de seguimiento técnico
            </text>

            <line
              x1="32"
              y1="88"
              x2="463"
              y2="88"
              stroke="#505050"
            />

            <text
              x="32"
              y="118"
              fill="#E5E5E5"
              font-family="Arial, sans-serif"
              font-size="14">
              Desarrollo · análisis · implementación · testing
            </text>

            <text
              x="32"
              y="145"
              fill="#E5E5E5"
              font-family="Arial, sans-serif"
              font-size="14">
              documentación · seguimiento de cambios
            </text>

            <text
              x="32"
              y="174"
              fill="#8F8F8F"
              font-family="Arial, sans-serif"
              font-size="11">
              Actividad incluida en las estadísticas privadas del perfil
            </text>

          </svg>'''

          with open(
              "profile/bitacora.svg",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(svg)

          print("Generated: profile/bitacora.svg")
          PY

      # =======================================================
      # CARD 5
      # LOGROS DE GITHUB
      # =======================================================

      - name: Generate GitHub trophies card
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$STATS_PAT" | tr -d '\r\n')

          GH_TOKEN="$CLEAN_TOKEN" gh api graphql \
            -f query='
              query($login: String!) {
                user(login: $login) {
                  repositories(
                    first: 100,
                    ownerAffiliations: OWNER,
                    privacy: PUBLIC
                  ) {
                    totalCount
                    nodes {
                      stargazerCount
                    }
                  }
                }
              }
            ' \
            -F login="$USERNAME" \
            > trophies-data.json

          PUBLIC_REPOS=$(jq -r \
            '.data.user.repositories.totalCount' \
            trophies-data.json)

          TOTAL_STARS=$(jq \
            '[.data.user.repositories.nodes[].stargazerCount] | add // 0' \
            trophies-data.json)

          COMMITS=$(jq -r \
            '.data.user.contributionsCollection.totalCommitContributions' \
            contribution-data.json)

          CONTRIBUTIONS=$(jq -r \
            '.data.user.contributionsCollection.contributionCalendar.totalContributions' \
            contribution-data.json)

          echo "Public repositories: $PUBLIC_REPOS"
          echo "Stars: $TOTAL_STARS"
          echo "Commits last 12 months: $COMMITS"
          echo "Contributions last 12 months: $CONTRIBUTIONS"

          export PUBLIC_REPOS
          export TOTAL_STARS
          export COMMITS
          export CONTRIBUTIONS

          mkdir -p profile

          python3 <<'PY'
