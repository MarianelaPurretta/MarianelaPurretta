name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =======================================================
      # CHECKOUT
      # =======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =======================================================
      # VALIDAR TOKEN
      # =======================================================

      - name: Check PAT rate limit
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
        run: |
          echo "GitHub API rate limit:"

          curl -s \
            -H "Authorization: Bearer $STATS_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/rate_limit \
            | jq '.rate | {limit, remaining, reset}'


      # =======================================================
      # VALIDAR ACCESO A BITACORA
      # =======================================================

      - name: Check Bitacora access
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $STATS_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MarianelaPurretta/Bitacora)

          echo "Bitacora API status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "PAT cannot access Bitacora"
            exit 1
          fi


      # =======================================================
      # CARD 1
      # ACTIVIDAD ÚLTIMOS 12 MESES
      # COMMITS + PULL REQUESTS
      # =======================================================

      - name: Generate last 12 months card
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          FROM_DATE=$(date -u -d "365 days ago" +"%Y-%m-%dT00:00:00Z")
          TO_DATE=$(date -u +"%Y-%m-%dT23:59:59Z")

          echo "From: $FROM_DATE"
          echo "To:   $TO_DATE"

          QUERY='
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                totalCommitContributions
                totalPullRequestContributions
              }
            }
          }'

          PAYLOAD=$(jq -n \
            --arg query "$QUERY" \
            --arg login "$USERNAME" \
            --arg from "$FROM_DATE" \
            --arg to "$TO_DATE" \
            '{
              query: $query,
              variables: {
                login: $login,
                from: $from,
                to: $to
              }
            }')

          RESPONSE=$(curl -s \
            -X POST \
            -H "Authorization: Bearer $STATS_PAT" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/graphql \
            -d "$PAYLOAD")

          echo "$RESPONSE" | jq .

          ERRORS=$(echo "$RESPONSE" | jq -r '.errors // empty')

          if [ -n "$ERRORS" ]; then
            echo "GraphQL returned errors:"
            echo "$RESPONSE" | jq '.errors'
            exit 1
          fi

          COMMITS=$(echo "$RESPONSE" | jq -r \
            '.data.user.contributionsCollection.totalCommitContributions')

          PRS=$(echo "$RESPONSE" | jq -r \
            '.data.user.contributionsCollection.totalPullRequestContributions')

          if [ "$COMMITS" = "null" ] || [ "$PRS" = "null" ]; then
            echo "Could not obtain contribution statistics."
            exit 1
          fi

          echo "Commits last 12 months: $COMMITS"
          echo "Pull Requests last 12 months: $PRS"

          mkdir -p profile

          export COMMITS
          export PRS

          python3 <<'PY'
          import os

          commits = os.environ["COMMITS"]
          prs = os.environ["PRS"]

          svg = f'''<svg
            width="495"
            height="195"
            viewBox="0 0 495 195"
            xmlns="http://www.w3.org/2000/svg">

            <rect
              x="0.5"
              y="0.5"
              width="494"
              height="194"
              rx="4.5"
              fill="#000000"
              stroke="#FFFFFF"
            />

            <text
              x="247.5"
              y="38"
              text-anchor="middle"
              fill="#FFA500"
              font-family="Arial, sans-serif"
              font-size="19"
              font-weight="700">
              Actividad de los últimos 12 meses
            </text>

            <line
              x1="247.5"
              y1="62"
              x2="247.5"
              y2="158"
              stroke="#FFFFFF"
              opacity="0.55"
            />

            <text
              x="125"
              y="105"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="34"
              font-weight="700">
              {commits}
            </text>

            <text
              x="125"
              y="135"
              text-anchor="middle"
              fill="#FFA500"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="700">
              Commits
            </text>

            <text
              x="370"
              y="105"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="34"
              font-weight="700">
              {prs}
            </text>

            <text
              x="370"
              y="135"
              text-anchor="middle"
              fill="#FFA500"
              font-family="Arial, sans-serif"
              font-size="15"
              font-weight="700">
              Pull Requests
            </text>

            <text
              x="247.5"
              y="174"
              text-anchor="middle"
              fill="#AAAAAA"
              font-family="Arial, sans-serif"
              font-size="11">
              Actividad registrada durante los últimos 12 meses
            </text>

          </svg>'''

          output = "profile/last-12-months.svg"

          with open(output, "w", encoding="utf-8") as file:
              file.write(svg)

          print(f"Generated: {output}")
          print(f"Commits: {commits}")
          print(f"Pull Requests: {prs}")
          PY


      # =======================================================
      # CARD 2
      # ESTADÍSTICAS GENERALES
      # =======================================================

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&number_format=long&card_width=495&bg_color=000000&title_color=FFA500&text_color=FFFFFF&icon_color=FFA500&border_color=FFFFFF&locale=es
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: true


      # =======================================================
      # CARD 3
      # LENGUAJES MÁS UTILIZADOS
      # =======================================================

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&card_width=495&bg_color=000000&title_color=FFA500&text_color=FFFFFF&border_color=FFFFFF&locale=es
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: true


      # =======================================================
      # VERIFICAR LAS 3 CARDS
      # =======================================================

      - name: Verify generated cards
        run: |
          echo "Files generated:"
          ls -lah profile/

          test -f profile/last-12-months.svg
          test -f profile/stats.svg
          test -f profile/top-langs.svg

          echo "All 3 cards were generated successfully."


      # =======================================================
      # COMMIT AUTOMÁTICO
      # =======================================================

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/last-12-months.svg
          git add profile/stats.svg
          git add profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub stats"
          git push
